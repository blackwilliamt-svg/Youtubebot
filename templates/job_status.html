{% extends "base.html" %}
{% block title %}Job #{{ job.id }}{% endblock %}
{% block content %}
<h1>Job #{{ job.id }} <span class="status status-{{ job.status }}" id="status">{{ job.status }}</span></h1>
<p id="message">{{ job.message or '' }}</p>
<p><a href="{{ url_for('compilations') }}">Go to compilations →</a></p>

<script>
  async function poll() {
    const res = await fetch("{{ url_for('job_status_api', job_id=job.id) }}");
    const job = await res.json();
    document.getElementById('status').textContent = job.status;
    document.getElementById('status').className = 'status status-' + job.status;
    document.getElementById('message').textContent = job.message || '';
    if (job.status === 'pending' || job.status === 'running') {
      setTimeout(poll, 2000);
    } else if (job.status === 'done') {
      setTimeout(() => { window.location = "{{ url_for('compilations') }}"; }, 1500);
    }
  }
  setTimeout(poll, 2000);
</script>
{% endblock %}
